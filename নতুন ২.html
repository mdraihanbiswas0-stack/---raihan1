#biz .bzti{background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.22);border-radius:14px;padding:10px;text-align:center}
#biz .bzti small{display:block;font-size:12.5px;opacity:.8}#biz .bzti b{font-size:15px}
#biz .bzlinks{display:flex;gap:8px;margin:2px 0 4px}
#biz .bzlinks button{flex:1;border:1px solid rgba(127,127,127,.4);background:rgba(127,127,127,.16);color:inherit;border-radius:12px;padding:11px 4px;font-size:14px;font-weight:600}
#biz .bzgr2 .bzh{font-size:14px}
#biz .bzgr2 .bzr{font-size:14px}
#biz .bzgr2 .bzp{font-size:15px;padding:7px 9px}

#biz .bzmt{margin:-6px 4px 10px;text-align:center}
#biz .bzprog{height:12px;border-radius:7px;background:rgba(127,127,127,.25);overflow:hidden;margin:6px 0}
#biz .bzprog i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:7px}
.sw{display:inline-block;width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.4);margin-left:4px;vertical-align:middle}
.tpv{display:inline-flex;align-items:center;gap:3px;padding:4px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
.tpv i{width:14px;height:22px;border-radius:5px}
.tpv b{width:24px;height:24px;border-radius:6px;border:1.5px solid;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.ov.lt{color-scheme:light}
.ov.lt .sec{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12)}
.ov.lt select,.ov.lt input[type=text],.ov.lt input[type=date],.ov.lt textarea{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.3)}
.ov.lt .hi{border-bottom-color:rgba(0,0,0,.15)}
#biz .dyc{background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.22);border-radius:14px;margin-bottom:8px;overflow:hidden}
#biz .dyc.on{border-color:rgba(124,58,237,.75)}
#biz .dyh{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer}
#biz .dyh:active{opacity:.7}
#biz .dyn{flex:0 0 auto;min-width:38px;text-align:center;border-radius:10px;padding:4px 6px;font-size:12.5px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#7c3aed);color:#fff}
#biz .dyn.z{background:rgba(127,127,127,.35)}
#biz .dya{flex:0 0 auto;opacity:.7;font-size:13px}

#biz .dyt{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;margin:0 2px 8px}

#biz .sx{position:absolute;inset:0;z-index:3;background:var(--bg);display:flex;flex-direction:column}
#biz .sx[hidden]{display:none!important}
#biz .sxh{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(127,127,127,.3)}
#biz .sxh .bzin{flex:1;min-width:0;width:auto}
#biz .sxh button{flex:0 0 auto;border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:50%;width:38px;height:38px;font-size:16px;padding:0}
#biz .sxm{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#biz .sxbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin:2px 12px 6px;padding:9px 14px;border-radius:999px;background:rgba(127,127,127,.18);border:1px solid rgba(127,127,127,.35);font-size:14px;opacity:.95;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#biz .sxbar span:last-child{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#biz .sxbar:active{opacity:.7}
.sfh{display:none!important}
.sfc{font-size:12.5px;opacity:.75;margin:4px 2px 0}
.sstk{position:sticky;top:0;z-index:4;background:inherit;margin:calc(-12px - env(safe-area-inset-top,0px)) -16px 8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.sstk h2{margin:0 0 8px}

/* ===== আধুনিক ৩ডি সেটিংস হাব (স্থির, নড়াচড়া নেই) ===== */
.hub{display:none;gap:12px;padding:6px 0 16px}
.hub.on{display:grid}
.hc{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid rgba(127,127,127,.28);border-radius:24px;padding:14px 14px 14px 16px;color:inherit;font-family:inherit;cursor:pointer;overflow:hidden;background:rgba(127,127,127,.12);background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 24%,transparent),rgba(127,127,127,.06) 60%),rgba(127,127,127,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 24px -12px rgba(0,0,0,.55);transition:transform .15s,box-shadow .15s}
.hc::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--c1),var(--c2))}
.hc:active{transform:scale(.985);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 10px -6px rgba(0,0,0,.5)}
.hi3{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:29px;margin-bottom:5px;background:radial-gradient(circle at 28% 16%,rgba(255,255,255,.7),transparent 48%),linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--c3),0 12px 18px -4px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.75),inset 0 -4px 6px rgba(0,0,0,.22);text-shadow:0 2px 3px rgba(0,0,0,.35)}
.hi3.sm{width:44px;height:44px;font-size:22px;border-radius:14px;margin-bottom:4px;box-shadow:0 4px 0 var(--c3),0 8px 12px -3px rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.75),inset 0 -3px 5px rgba(0,0,0,.22)}
.ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ht b{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ht small{opacity:.7;font-size:12.5px}
.hch{display:flex;flex-wrap:wrap;gap:4px}
.hch i{font-style:normal;font-size:11px;line-height:1.5;padding:1px 8px;border-radius:999px;background:rgba(127,127,127,.16);border:1px solid rgba(127,127,127,.25)}
.hg{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;background:rgba(127,127,127,.18)}
.nw{font-style:normal;font-size:10px;font-weight:700;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:1px 8px;border-radius:999px}
.noan .hc{transition:none}
.secw{display:none}
.secw.on,.srch .secw{display:block}
.srch .hub,.srch .sbar{display:none!important}
.secw.on{counter-reset:st}
.secw.on>.sec>h3:first-child::before,.secw.on>.bzc>.bzh:first-child::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(150deg,#60a5fa,#2563eb);box-shadow:0 3px 0 #1e3a8a,inset 0 1px 1px rgba(255,255,255,.6);vertical-align:middle}
.srch .secw>.sec>h3:first-child::before,.srch .secw>.bzc>.bzh:first-child::before{display:none!important}
.sbar{margin:2px 0 12px}
.sbar .hc{padding:10px 14px 10px 16px}
.secw .sec,#biz .secw .bzc{border-radius:20px;background:linear-gradient(180deg,rgba(127,127,127,.16),rgba(127,127,127,.07));border:1px solid rgba(127,127,127,.22)}
.secw .sec h3{opacity:1;font-weight:700}
.sback{padding:5px 13px!important;font-size:20px!important;line-height:1;margin-right:6px;border-radius:12px!important}
.stt{display:flex;align-items:center;gap:4px;min-width:0}
.prg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0}
.prb{border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 14px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
.prb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.prb i{display:block;height:16px;border-radius:6px}
.prb span{display:flex;gap:4px}
.prb span b{flex:1;height:16px;border-radius:6px}
.prb em{font-style:normal;font-weight:700;font-size:13px;text-align:center}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed rgba(127,127,127,.3)}
.srow:last-child{border-bottom:0}

/* ===== ব্যবসায়িক হিসাব: আধুনিক ৩ডি ডিজাইন স্তর (শুধু চেহারা) ===== */
#biz .bzm{padding:6px 14px 22px}
/* কার্ড */
#biz .bzc,#biz .dyc,#biz .bzti{border-radius:22px;border:1px solid rgba(127,127,127,.26);background:rgba(127,127,127,.12);background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(127,127,127,.06) 55%),rgba(127,127,127,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 14px 26px -14px rgba(0,0,0,.65)}
#biz .bzc{padding:14px;margin:0 0 14px}
#biz .bzh{font-size:15.5px;margin-bottom:10px}
#biz .dyc{margin-bottom:10px}
#biz .dyc.on{border-color:rgba(124,58,237,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px rgba(124,58,237,.5),0 14px 26px -14px rgba(124,58,237,.6)}
/* সেকশন শিরোনাম */
#biz .bzsec{border-left:0;padding:0;margin:20px 2px 10px;font-size:16.5px;letter-spacing:.1px}
#biz .bzsec::before{content:"";flex:0 0 auto;width:5px;height:22px;border-radius:4px;background:linear-gradient(#a78bfa,#6366f1);box-shadow:0 0 10px rgba(124,58,237,.6);margin-right:2px}
#biz .bzsec{justify-content:flex-start}
#biz .bzsec>small{margin-left:auto}
/* ক্রয় / বিক্রয় / লাভ — উঁচু ৩ডি টাইল */
#biz .bz3{gap:8px}
#biz .bz3>div{border-radius:16px;padding:11px 4px 10px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(127,127,127,.10));border:1px solid rgba(127,127,127,.24);box-shadow:0 4px 0 rgba(0,0,0,.28),0 10px 14px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
#biz .bz3 .bzpf.g{background:linear-gradient(180deg,rgba(74,222,128,.30),rgba(22,163,74,.16));border-color:rgba(74,222,128,.55);box-shadow:0 4px 0 rgba(21,128,61,.55),0 10px 16px -8px rgba(34,197,94,.5),inset 0 1px 0 rgba(255,255,255,.3)}
#biz .bz3 .bzpf.r{background:linear-gradient(180deg,rgba(248,113,113,.30),rgba(220,38,38,.16));border-color:rgba(248,113,113,.55);box-shadow:0 4px 0 rgba(153,27,27,.55),0 10px 16px -8px rgba(239,68,68,.5),inset 0 1px 0 rgba(255,255,255,.3)}
#biz .bzp{border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
#biz .bzp.g{background:linear-gradient(180deg,rgba(74,222,128,.28),rgba(22,163,74,.14));box-shadow:0 4px 0 rgba(21,128,61,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#biz .bzp.r{background:linear-gradient(180deg,rgba(248,113,113,.28),rgba(220,38,38,.14));box-shadow:0 4px 0 rgba(153,27,27,.5),inset 0 1px 0 rgba(255,255,255,.25)}
/* ক্রয় / বিক্রয় / খরচ বোতাম — ৩ডি চাপা বোতাম */
#biz .bzq{gap:10px;margin-bottom:14px}
#biz .bzq button{border:1px solid currentColor;border-radius:18px;padding:13px 4px 12px;font-size:16.5px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(127,127,127,.08));box-shadow:0 5px 0 currentColor,0 12px 16px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,box-shadow .12s}
#biz .bzq button:active{transform:translateY(4px);box-shadow:0 1px 0 currentColor,0 3px 6px -3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
/* এন্ট্রির সারি */
#biz .bze{border-radius:18px;padding:11px 12px;gap:12px;border:1px solid rgba(127,127,127,.22);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(127,127,127,.06));box-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 14px -10px rgba(0,0,0,.6)}
#biz .bze:active{opacity:1;transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
#biz .bzt{min-width:50px;border:0;border-radius:12px;padding:6px 8px;color:#fff!important;background:linear-gradient(150deg,#64748b,#475569);box-shadow:0 3px 0 #1e293b,inset 0 1px 1px rgba(255,255,255,.45);text-shadow:0 1px 1px rgba(0,0,0,.35)}
#biz .bzt.o{background:linear-gradient(150deg,#fbbf24,#d97706);box-shadow:0 3px 0 #78350f,inset 0 1px 1px rgba(255,255,255,.5)}
#biz .bzt.g{background:linear-gradient(150deg,#4ade80,#16a34a);box-shadow:0 3px 0 #14532d,inset 0 1px 1px rgba(255,255,255,.5)}
#biz .bzt.p{background:linear-gradient(150deg,#c084fc,#7c3aed);box-shadow:0 3px 0 #4c1d95,inset 0 1px 1px rgba(255,255,255,.5)}
#biz .bzt.b{background:linear-gradient(150deg,#60a5fa,#2563eb);box-shadow:0 3px 0 #1e3a8a,inset 0 1px 1px rgba(255,255,255,.5)}
#biz .bzt.r{background:linear-gradient(150deg,#f87171,#dc2626);box-shadow:0 3px 0 #7f1d1d,inset 0 1px 1px rgba(255,255,255,.5)}
/* দিনপঞ্জির সিরিয়াল ব্যাজ */
#biz .dyn{border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 #312e81,inset 0 1px 1px rgba(255,255,255,.5)}
#biz .dyn.z{box-shadow:0 3px 0 rgba(0,0,0,.3)}
/* তারিখ বাছাই, বার */
#biz .bzdn button{border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
#biz .bzdn button:active{transform:translateY(2px);box-shadow:none}
#biz .bzdn .td{box-shadow:0 3px 0 #312e81,inset 0 1px 1px rgba(255,255,255,.4)}
#biz .bzd{border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#biz .bzd.on{box-shadow:0 3px 0 #312e81,0 8px 14px -6px rgba(99,102,241,.6)}
#biz .bzin{border-radius:14px;box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
/* লিংক / সাধারণ বোতাম */
#biz .bzlinks button,#biz .bzbt button,#biz .bzch button{box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
#biz .bzlinks button:active,#biz .bzbt button:active,#biz .bzch button:active{transform:translateY(2px);box-shadow:none}
#biz .bzlinks button{border-radius:14px}
#biz .bzdel{border-radius:14px;background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 4px 0 #7f1d1d}
#biz .bzdel:active{transform:translateY(3px);box-shadow:0 1px 0 #7f1d1d}
/* প্রগ্রেস বার */
#biz .bzprog{height:16px;border-radius:9px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
#biz .bzprog i{border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%),linear-gradient(90deg,#3b82f6,#22c55e);box-shadow:0 0 12px rgba(34,197,94,.55)}
/* নিচের নেভিগেশন — ভাসমান ৩ডি ডক */
#biz .bzn{margin:0 10px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;gap:4px;border:1px solid rgba(127,127,127,.3);border-radius:26px;background:rgba(20,26,38,.96);box-shadow:0 14px 30px -10px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14)}
#biz.lt .bzn{background:rgba(255,255,255,.96)}

#biz .bzn button.on{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(99,102,241,.35) 70%);box-shadow:0 4px 0 rgba(49,46,129,.75),0 10px 16px -8px rgba(99,102,241,.8),inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-3px)}
#biz .bzn button.bzplus{flex:0 0 40px;width:40px;height:40px;align-self:center;margin:0 6px;padding:0;justify-content:center;border-radius:50%;opacity:1;color:#fff;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 3px 0 rgba(0,0,0,.35),0 6px 12px -5px rgba(22,163,74,.8),inset 0 1px 0 rgba(255,255,255,.4)}
#biz .bzn button.bzplus span{font-size:26px;font-weight:700;line-height:1;filter:none}
#biz .bzn button.bzplus:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#biz .bzsh.qa{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 20%),linear-gradient(155deg,rgba(99,102,241,.38),rgba(14,165,233,.14) 48%,rgba(16,185,129,.26)),var(--bg);border:1px solid rgba(255,255,255,.3);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.25)}
#biz .qa .bzsht b{font-size:19px;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px rgba(129,140,248,.8)}
#biz .qa .bzsht button{background:linear-gradient(180deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.1) 50%,rgba(0,0,0,.12) 52%,rgba(0,0,0,0) 100%),linear-gradient(180deg,#f87171,#b91c1c);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 3px 0 #7f1d1d,0 8px 14px -5px rgba(220,38,38,.7),inset 0 1px 0 rgba(255,255,255,.6)}
#biz .qa .bzlb{display:block;font-weight:800;margin:14px 2px 6px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
#biz .qa .bzin{background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(255,255,255,.07));border:1.5px solid rgba(255,255,255,.28);border-radius:16px;box-shadow:inset 0 4px 8px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.18),0 1px 0 rgba(255,255,255,.35),0 0 0 rgba(0,0,0,0);transition:box-shadow .15s,border-color .15s}
#biz .qa .bzin.big{font-size:24px;font-weight:800;padding:13px 14px;letter-spacing:.5px}
#biz .qa .qb{border-color:rgba(251,146,60,.85)}
#biz .qa .qb:focus{outline:0;box-shadow:inset 0 4px 8px rgba(0,0,0,.5),0 0 0 3px rgba(251,146,60,.35),0 0 22px rgba(251,146,60,.55)}
#biz .qa .qs{border-color:rgba(74,222,128,.85)}

#biz .qa .qn{border-color:rgba(167,139,250,.7)}
#biz .qa .qn:focus,#biz .qa input[type=date]:focus{outline:0;box-shadow:inset 0 4px 8px rgba(0,0,0,.5),0 0 0 3px rgba(129,140,248,.4),0 0 22px rgba(129,140,248,.55)}
#biz .qa .bzhint{border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
#biz .qa .bzact{gap:12px;margin-top:20px}
#biz .qa .bzact button{border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:15px 8px;font-size:16.5px;text-shadow:0 2px 2px rgba(0,0,0,.45)}

function dayMap(){const m={};B.e.forEach(x=>{const o=m[x.d]||(m[x.d]={buy:0,sell:0,exp:0,c:0});o.c++;if(x.t==="buy")o.buy+=x.a;else if(x.t==="sell")o.sell+=x.a;else o.exp+=x.a});return m}
const dnet=o=>o.sell-o.buy-o.exp;
const mlab=k=>MN[+k.slice(5,7)-1]+" "+D(k.slice(0,4));
function dayCard(k,dm,ser){const o=dm[k]||{buy:0,sell:0,exp:0,c:0},nt=B.n[k]||"",n=dnet(o),l=lbl(n),op=!!V.op[k];
 let h=`<div class="dyc${op?" on":""}"><div class="dyh" onclick="bizDayT('${k}')"><span class="dyn${ser[k]?"":" z"}">${ser[k]?"#"+D(ser[k]):"—"}</span><div class="bzi"><b>${dateL(k)}${k===todayS()?" · আজ":""}</b><small>${o.c?D(o.c)+"টি এন্ট্রি":"এন্ট্রি নেই"}${nt?" · 📝 নোট":""}</small></div>${o.c?`<b class="${l[1]}">${l[0]} ${sg(Math.abs(n))}</b>`:""}<span class="dya">${op?"▴":"▾"}</span></div>`;
 if(op){const es=B.e.filter(x=>x.d===k).sort((a,b)=>a.ts-b.ts);
  h+=`<div class="dyb">`+(o.c?`<div class="bz3"><div><small>ক্রয়</small><b class="o">${sg(o.buy)}</b></div><div><small>বিক্রয়</small><b class="g">${sg(o.sell)}</b></div><div class="bzpf ${l[1]}"><small>${l[0]}</small><b>${sg(Math.abs(n))}</b></div></div>${o.exp?`<div class="bzex">খরচ ${sg(o.exp)} হিসাবে ধরা হয়েছে</div>`:""}`:`<div class="bzemp">এই দিনে কোনো এন্ট্রি নেই।</div>`)
  +es.map(x=>row(x)).join("")
  +`<div class="bzq"><button class="o" onclick="bizNewD('buy','${k}')">＋ ক্রয়</button><button class="g" onclick="bizNewD('sell','${k}')">＋ বিক্রয়</button><button class="p" onclick="bizNewD('exp','${k}')">＋ খরচ</button></div>`
  +`<label class="bzlb">📝 এই দিনের নোট</label><textarea class="bzin" rows="2" placeholder="ঐচ্ছিক…" oninput="bizNoteD('${k}',this.value)">${esc(nt)}</textarea>`
  +`<div class="bzlinks" style="margin-top:8px"><button onclick="bizOpenD('${k}')">📒 খাতায় খুলুন</button>${o.c||nt?`<button onclick="bizMoveDay('${k}')">📅 দিন সরান</button>`:""}</div></div>`}
 return h+`</div>`}
function vDays(){
 const t=todayS(),dm=dayMap(),rec=[...new Set([...Object.keys(dm),...Object.keys(B.n).filter(k=>B.n[k])])].sort(),ser={};rec.forEach((k,i)=>ser[k]=i+1);
 const ms=new Set(rec.map(k=>k.slice(0,7)));ms.add(t.slice(0,7));if(V.dm!=="all")ms.add(V.dm);
 const months=[...ms].sort().reverse();let list;
 if(V.dm==="all")list=rec.slice();
 else if(V.de){const y=+V.dm.slice(0,4),m=+V.dm.slice(5,7),n=new Date(y,m,0).getDate();list=[];for(let i=1;i<=n;i++){const s=V.dm+"-"+pad(i);if(s<=t||dm[s]||B.n[s])list.push(s)}}
 else list=rec.filter(k=>k.slice(0,7)===V.dm);
 list.sort();if(V.dord==="desc")list.reverse();
 const a={buy:0,sell:0,exp:0,net:0};let wd=0;list.forEach(k=>{const o=dm[k];if(o){a.buy+=o.buy;a.sell+=o.sell;a.exp+=o.exp}if(o||B.n[k])wd++});a.net=a.sell-a.buy-a.exp;
 const shown=list.slice(0,V.dl),title=(V.dm==="all"?"সব সময়":mlab(V.dm))+" — মোট";
 return `${B.s.name?`<div class="bzname">🏪 ${esc(B.s.name)}</div>`:""}

<div class="bzsec">📋 দিন অনুযায়ী তালিকা</div>
${shown.length?shown.map(k=>dayCard(k,dm,ser)).join(""):`<div class="bzemp">${V.dm==="all"?"এখনো কোনো এন্ট্রি নেই।":"এই মাসে কোনো এন্ট্রি নেই।"}<br>উপরের বোতাম দিয়ে যেকোনো তারিখে লিখুন।</div>`}
${list.length>shown.length?`<div class="bzlinks"><button onclick="bizDMore()">আরও দেখান (${D(list.length-shown.length)}টি দিন বাকি)</button></div>`:""}`}

function solveExpr(ast){

 if(sim!==given)st.push({h:isConst(p)?"মান নির্ণয়":"সমজাতীয় পদ মিলিয়ে সরল করে পাই",b:sim});

  if(fx&&fx.changed)st.push({h:"উৎপাদকে বিশ্লেষণ",b:`${sim} = ${fx.html}`});
  ans=`সরল রূপ: ${sim}`+(fx&&fx.changed?`<br>উৎপাদক: ${fx.html}`:"")}

/* ---------- একটি সমীকরণ ---------- */
const pickVar=vs=>vs.includes("x")?"x":vs[0];
function solveEquation(el,er){
 let L,R,rat=false;
 try{L=evp(el);R=evp(er);if(hasNeg(L)||hasNeg(R))rat=true}catch(e){if(e.rat)rat=true;else throw e}
 if(rat)return solveRatEq(el,er);
 const st=[],P=padd(L,pneg(R)),given=`${astH(el)} = ${astH(er)}`;

 hintSteps(el,st);hintSteps(er,st);
 const xl=expH(el,L),xr=expH(er,R);
 if(xl||xr)st.push({h:"প্রতিটি পদকে গুণ করে বন্ধনী খুলে",b:`${xl||polyH(L)} = ${xr||polyH(R)}`});
 const sim=`${polyH(L)} = ${polyH(R)}`;
 if(sim!==given)st.push({h:"সমজাতীয় পদ মিলিয়ে সরল করে",b:sim});
 if(isZ(P)){st.push({h:"তুলনা",b:`বামপক্ষ = ${polyH(L)}<br>ডানপক্ষ = ${polyH(R)}<br>উভয়পক্ষ সমান`});
  return{steps:st,ans:"বামপক্ষ = ডানপক্ষ — অভেদটি প্রমাণিত (চলকের সকল মানের জন্য সত্য)"}}
 const vs=vars(P);
 if(!vs.length){return{steps:st,ans:`${polyH(L)} ≠ ${polyH(R)} — সমীকরণটি মিথ্যা, কোনো সমাধান নেই`}}

 if(vs.length>1){
  if(degV(P,v)!==1)throw new Error("একাধিক চলকযুক্ত উচ্চঘাতের সমীকরণ এখনো সমর্থিত নয়। (একাধিক চলকের জন্য কমা দিয়ে একাধিক সমীকরণ লিখুন)");
  const A={},B={};terms(P).forEach(t=>{if(t.m[v]){const m={...t.m};delete m[v];A[mk(m)]={c:t.c,m}}else B[mk(t.m)]=t});

  const nt=isConst(A)?"":`<br><small>(শর্ত: ${polyH(A)} ≠ 0)</small>`;

 const nz=normInt(arr);
 if(!f1(nz.k))st.push({h:mulText(nz.k),b:`${polyH(fromU(nz.a.map(x=>fr(x)),v))} = 0`});
 const roots=sortRoots(solveIntPoly(nz.a,v,st));
 const ex=roots.filter(r=>r.ex).slice(0,4);
 if(ex.length)st.push({h:"যাচাই",b:ex.map(r=>{const l=subst(L,v,pconst(r.ex)),rr=subst(R,v,pconst(r.ex));return`${v} = ${fh(r.ex)} বসিয়ে: বামপক্ষ = ${fh(cv(l))}, ডানপক্ষ = ${fh(cv(rr))} ✓`}).join("<br>")});

 if(rows.length<n)throw new Error(`চলক ${n}টি (${vs.join(", ")}), কিন্তু সমীকরণ ${rows.length}টি — সমাধানের জন্য কমপক্ষে ${n}টি সমীকরণ লাগবে`);

   const l=blcm(babs(p.n),babs(a.n)),sk=l/babs(a.n),sp=-(a.n<0n?-1n:1n)*(p.n<0n?-1n:1n)*(l/babs(p.n));

   st.push({h:`${vs[col]} অপসারণ: ${mulPart(lk,sk)} ${sp<0n?"−":"+"} ${mulPart(lp,babs(sp))}`,b:`(${next}) ${rowH(nn.r)}${nn.g>1n?" <small>(সরল করে)</small>":""}`});
   rows[i]={r:nn.r,l:next++}}
  pr++}
 for(let i=0;i<rows.length;i++){const r=rows[i].r;if(r.slice(0,n).every(f0)&&!f0(r[n]))
  {st.push({h:"পরস্পরবিরোধী সমীকরণ",b:`(${rows[i].l}) 0 = ${fh(r[n])} — এটি অসম্ভব`});return{steps:st,ans:"সমীকরণগুলো পরস্পরবিরোধী — কোনো সমাধান নেই"}}}

function nonlinSys(items,vs,st){

function solveSystem(items){
 const st=[];
 st.push({h:"প্রদত্ত সমীকরণ জোট",b:items.map((it,i)=>`(${i+1}) ${astH(it.el)} = ${astH(it.er)}`).join("<br>")});

let DEN=[];
